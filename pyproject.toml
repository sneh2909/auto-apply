[project]
name = "autoapply"
version = "0.1.0"
description = "Semi-automated job application pipeline (India ML market)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymongo>=4.9",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-genai>=1.0",
    "groq>=0.12",
    "tenacity>=8.5",
    "playwright>=1.46",
    "pypdf>=4.3",
    "rapidfuzz>=3.9",
    "openai>=1.40",
]

[project.optional-dependencies]
agent = ["browser-use>=0.1.40"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipython>=8.26",
]

[project.scripts]
autoapply = "autoapply.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoapply"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
